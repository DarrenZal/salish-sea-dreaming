    location: "Rough estimate paragraph"
    source:
      type: quote
      ref: "Derived estimate: 320 kimg target * (353 sec/kimg measured at 512 on TELUS H200) * 4 (theoretical quadratic area scaling from 512^2 to 1024^2) ≈ 451,840 sec ≈ 5.2 days."
      evidence: "The 353 sec/kimg base rate is from the project's March 2026 TELUS H200 fish-model training run (session ba05bf17). Quadratic scaling with image area is the StyleGAN2-ada paper's approximation; real-world variance at 1024 is unmeasured by us. The 320 kimg target reflects the cumulative training kimg behind the existing 120 kimg early-aesthetic checkpoint (Arshia 320 kimg base interpretation, per operator clarification 2026-05-16 eve). This is order-of-magnitude only; flagged as 'rough estimate' in the draft."
  - claim: "It is unknown whether the 120/320 kimg aesthetic survives the resolution jump from 512 to 1024."
    location: "Rough estimate paragraph"
    source:
      type: quote
      ref: "StyleGAN2-ada architecture: different image resolutions instantiate different per-resolution synthesis blocks (feature maps differ per layer), so aesthetic characteristics learned at one resolution do not deterministically transfer to another. The 120 kimg checkpoint we use was selected at 512; there is no measurement of 'equivalent aesthetic at 1024.'"
      evidence: "Architectural fact from the StyleGAN2-ada paper (Karras et al. 2020): the per-resolution synthesis blocks have distinct learnable weights. No empirical test of aesthetic preservation across resolution jumps has been run by us. Stated as an unknown in the draft to surface as a real risk, not as a measurement."
